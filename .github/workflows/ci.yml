name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev/report extras
        run: pip install -e ".[dev,report]"

      - name: Run tests
        run: pytest --cov=ragcheck --cov-report=term-missing

      - name: Smoke-test the CLI against the sample dataset
        run: |
          ragcheck evaluate examples/sample_dataset.json --report /tmp/report.md --chart /tmp/chart.png
