[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragcheck"
version = "0.1.0"
description = "A small, dependency-light framework for evaluating RAG (retrieval-augmented generation) pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Venkatasai Vorsu" }]
keywords = ["rag", "llm", "evaluation", "retrieval", "nlp", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
report = ["matplotlib>=3.6"]
sbert = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
ragcheck = "ragcheck.cli:main"

[tool.setuptools.packages.find]
include = ["ragcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
